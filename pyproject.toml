[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyGrater"
version = "0.0.1"
description = "Debris disk modeling and radiative transfer"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.3",
    "astropy>=4.0",
    "tqdm>=4.60",
    "pyyaml>=5.0"
]

[project.optional-dependencies]
dev = ["pytest>=6.0", "black", "flake8", "mypy"]

[project.scripts]
pygrater-setup = "pyGrater.config.setup_cli:main"

[tool.setuptools]
packages = ["pyGrater"]